syntax = "proto3";

package bookmarks;

import "google/protobuf/timestamp.proto";

message Bookmark {
  int32 id = 1;
  string title = 2;
  string url = 3;
  optional string summary = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated string tags = 7;
  string user_id = 8;
}
